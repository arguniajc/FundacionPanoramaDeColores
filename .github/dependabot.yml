# Dependabot: revisa cada semana si hay versiones nuevas (en especial de seguridad)
# y abre un pull request por ecosistema. Las menores y parches van agrupadas.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      nuget-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/fundacion-web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # xlsx se instala desde el CDN oficial de SheetJS (ya no publican en npm)
      - dependency-name: xlsx
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
