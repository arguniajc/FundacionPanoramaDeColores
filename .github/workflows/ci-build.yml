name: CI — Build check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/FundacionPanorama.slnx

      # Falla si algún paquete NuGet (directo o transitivo) tiene vulnerabilidades conocidas
      - name: Paquetes vulnerables (NuGet)
        run: |
          dotnet list backend/FundacionPanorama.slnx package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -qiE "has the following vulnerable packages|tiene los paquetes vulnerables" vulnerables.txt; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas (ver arriba)"
            exit 1
          fi

      - name: Build (Release)
        run: dotnet build backend/FundacionPanorama.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/FundacionPanorama.Tests/FundacionPanorama.Tests.csproj --no-build -c Release --logger "console;verbosity=minimal"

  # Pruebas de integración contra un PostgreSQL TEMPORAL (Testcontainers levanta postgres:17-alpine en el
  # Docker del runner y lo destruye al terminar). No usa secretos ni ninguna BD real.
  backend-integracion:
    name: Backend — integración (PostgreSQL temporal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sin Docker la suite falla en vez de omitirse en silencio
      PANORAMA_IT_REQUERIR: '1'
      PANORAMA_IT_FUENTE: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/FundacionPanorama.IntegrationTests/FundacionPanorama.IntegrationTests.csproj

      - name: Build
        run: dotnet build backend/FundacionPanorama.IntegrationTests/FundacionPanorama.IntegrationTests.csproj --no-restore -c Release

      - name: Test (integración)
        run: dotnet test backend/FundacionPanorama.IntegrationTests/FundacionPanorama.IntegrationTests.csproj --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/fundacion-web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend/fundacion-web

      # Falla si una dependencia de producción tiene vulnerabilidades altas o críticas
      - name: Paquetes vulnerables (npm)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend/fundacion-web

      - name: Lint
        run: npx eslint src
        working-directory: frontend/fundacion-web

      - name: Test
        run: npm test
        working-directory: frontend/fundacion-web

      - name: Build
        run: npm run build
        working-directory: frontend/fundacion-web
        env:
          VITE_API_URL: https://fundacionpanoramadecolores-nez4.onrender.com
