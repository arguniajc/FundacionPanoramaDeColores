<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Política de seguridad de contenido: solo scripts propios y el botón de Google
      (sin scripts en línea), conexiones solo a la API (%VITE_API_URL% lo pone Vite según
      el entorno), Supabase y Google. Si un dato malicioso llegara a pintarse en la
      página, el navegador no ejecutaría su código ni lo dejaría enviar la sesión afuera.
      'unsafe-inline' en estilos: MUI (emotion) inserta sus estilos en etiquetas <style>.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com/gsi/client;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' %VITE_API_URL% https://*.supabase.co https://accounts.google.com/gsi/;
      frame-src https://accounts.google.com/gsi/;
      object-src 'none';
      base-uri 'self';
      form-action 'self'" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundación Panorama de Colores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Precarga el script de Google Identity Services para reducir el costo de inicialización -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link id="google-font-default"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" />
  </head>
  <body>
    <!-- Tema inicial antes de que React renderice (archivo aparte: la CSP prohíbe scripts en línea) -->
    <script src="%BASE_URL%tema-inicial.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
